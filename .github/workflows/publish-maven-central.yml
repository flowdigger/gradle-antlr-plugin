name: Publish Maven Central

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate publish secrets
        shell: bash
        run: |
          test -n "${ORG_GRADLE_PROJECT_mavenCentralUsername}" || (echo "Missing MAVEN_CENTRAL_USERNAME secret" && exit 1)
          test -n "${ORG_GRADLE_PROJECT_mavenCentralPassword}" || (echo "Missing MAVEN_CENTRAL_PASSWORD secret" && exit 1)
          test -n "${ORG_GRADLE_PROJECT_signingKey}" || (echo "Missing SIGNING_KEY secret" && exit 1)
          test -n "${ORG_GRADLE_PROJECT_signingPassword}" || (echo "Missing SIGNING_PASSWORD secret" && exit 1)

      - name: Publish and release to Maven Central via Sonatype
        run: ./gradlew --no-daemon clean check publishToSonatype closeAndReleaseSonatypeStagingRepository
