name: Publish Maven Central

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate publish secrets
        shell: bash
        run: |
          test -n "${ORG_GRADLE_PROJECT_mavenCentralUsername}" || (echo "Missing MAVEN_CENTRAL_USERNAME secret" && exit 1)
          test -n "${ORG_GRADLE_PROJECT_mavenCentralPassword}" || (echo "Missing MAVEN_CENTRAL_PASSWORD secret" && exit 1)
          test -n "${ORG_GRADLE_PROJECT_signingKey}" || (echo "Missing SIGNING_KEY secret" && exit 1)
          test -n "${ORG_GRADLE_PROJECT_signingPassword}" || (echo "Missing SIGNING_PASSWORD secret" && exit 1)

      - name: Build signed artifacts and Central bundle
        run: ./gradlew --no-daemon clean check packageCentralBundle

      - name: Upload bundle to Central Publisher API
        env:
          CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_PATH="$(find build/central-bundle -maxdepth 1 -type f -name '*.zip' | head -n 1)"
          if [ -z "$BUNDLE_PATH" ] || [ ! -f "$BUNDLE_PATH" ]; then
            echo "Bundle not found: $BUNDLE_PATH"
            ls -la build || true
            ls -la build/central-bundle || true
            exit 1
          fi
          TMP_DIR="$(mktemp -d)"
          unzip -q "$BUNDLE_PATH" -d "$TMP_DIR"
          find "$TMP_DIR" -type f ! -name '*.md5' ! -name '*.sha1' -print0 | while IFS= read -r -d '' f; do
            md5sum "$f" | awk '{print $1}' > "$f.md5"
            sha1sum "$f" | awk '{print $1}' > "$f.sha1"
          done
          rm -f "$BUNDLE_PATH"
          (
            cd "$TMP_DIR"
            zip -qr "$OLDPWD/$BUNDLE_PATH" .
          )
          rm -rf "$TMP_DIR"
          curl --fail-with-body -sS -u "$CENTRAL_USERNAME:$CENTRAL_PASSWORD" \
            -X POST "https://central.sonatype.com/api/v1/publisher/upload?nameSpace=org.flowdigger.gradle&publishingType=AUTOMATIC" \
            -F "bundle=@$BUNDLE_PATH" | tee central-upload-response.json
