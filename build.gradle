plugins {
    id 'antlr'
    id 'java-gradle-plugin'
    id 'com.gradle.plugin-publish' version '2.1.1'
    id 'jacoco'
    id 'maven-publish'
    id 'signing'
    id 'checkstyle'
    id 'org.owasp.dependencycheck' version '13.0.0'
    id 'com.github.spotbugs' version '6.1.0'
    id 'org.sonarqube' version '6.0.1.5171'
}

group = "org.flowdigger.gradle"
version = '1.0.3'

checkstyle {
    toolVersion = '10.26.1'
    configFile = file('checkstyle.xml')
}

ext {
    spotbugsEngineVersion = '4.8.6'
    findSecBugsVersion = '1.13.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.antlr:antlr4-runtime:4.13.1'
    implementation 'org.flowdigger:xir-sax:1.0.1'
    implementation 'org.flowdigger:xir-g4:1.0.0'

    antlr 'org.antlr:antlr4:4.13.1'

    testImplementation 'org.antlr:antlr4-runtime:4.13.1'
    testImplementation gradleTestKit()
    testImplementation 'junit:junit:4.13.2'
    spotbugsPlugins "com.h3xstream.findsecbugs:findsecbugs-plugin:${findSecBugsVersion}"
}

gradlePlugin {
    website = 'https://github.com/flowdigger/gradle-antlr-plugin'
    vcsUrl = 'https://github.com/flowdigger/gradle-antlr-plugin.git'

    plugins {
        antlrPlugin {
            id = 'org.flowdigger.antlr'
            implementationClass = 'org.flowdigger.gradle.antlr.XmlAstPlugin'
            displayName = 'Antlr XmlAst plugin'
            description = 'Converts source files to XML AST using pluggable ANTLR grammars, including ANTLRv4 task presets.'
            tags = ['antlr', 'xml', 'ast', 'sql', 'parser', 'g4', 'grammar']
        }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }

        withType(MavenPublication).configureEach {
            pom {
                name = 'ANTLR Plugin'
                description = 'Gradle plugin for ANTLR4 parser generation'
                url = 'https://github.com/flowdigger/gradle-antlr-plugin'

                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }

                developers {
                    developer {
                        id = 'jurgenei'
                        name = 'Jurgen Hildebrand'
                        email = 'ei@xs4all.nl'
                    }
                }

                scm {
                    connection = 'scm:git:https://github.com/flowdigger/gradle-antlr-plugin.git'
                    developerConnection = 'scm:git:ssh://git@github.com/flowdigger/gradle-antlr-plugin.git'
                    url = 'https://github.com/flowdigger/gradle-antlr-plugin'
                }
            }
        }
    }

    repositories {
        mavenLocal()
    }
}

signing {
    def signingKey = findProperty("signingKey")
    def signingPassword = findProperty("signingPassword")
    required = signingKey && signingPassword
    if (signingKey && signingPassword) {
        useInMemoryPgpKeys(signingKey, signingPassword)
        sign publishing.publications
    }
}

if (providers.gradleProperty('signingKey').present && providers.gradleProperty('signingPassword').present) {
    def signPublicationTasks = tasks.matching { it.name.startsWith('sign') && it.name.endsWith('Publication') }
    tasks.matching { it.name.startsWith('publish') && it.name.endsWith('PublicationToMavenLocal') }.configureEach {
        dependsOn signPublicationTasks
    }
}

// OWASP Dependency-Check configuration
def dependencyCheckSuppression = file('dependency-check-suppressions.xml')
dependencyCheck {
    formats = ['HTML', 'JSON', 'XML']
    failBuildOnCVSS = 7.0
    skipConfigurations = ['spotbugs', 'spotbugsPlugins', 'spotbugsSlf4j']
    if (dependencyCheckSuppression.exists()) {
        suppressionFile = dependencyCheckSuppression.absolutePath
    }
    // enableExperimental = false
    analyzers {
        ossIndex {
            enabled = false
        }
    }

    // NVD API key configuration (improves scan speed by 30-50%)
    // Get key from: https://nvd.nist.gov/developers/request-an-api-key
    nvd {
        apiKey = findProperty('org.owasp.dependencycheck.nvd.api.key') ?: System.getenv('NVD_API_KEY')
        // apiDelay = 100  // Milliseconds between API calls (optional)
    }
}

// SpotBugs configuration
spotbugs {
    toolVersion = spotbugsEngineVersion
    ignoreFailures = false
    effort = com.github.spotbugs.snom.Effort.valueOf('DEFAULT')
    reportLevel = com.github.spotbugs.snom.Confidence.valueOf('HIGH')
    excludeFilter = file('spotbugs-exclude.xml')
}

tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
    reports {
        html.required = true
        xml.required = false
    }
}

tasks.named('spotbugsMain') {
    reports {
        html.required = true
        xml.required = false
    }
}

// SonarQube configuration
sonar {
    properties {
        property "sonar.projectKey", "gradle-antlr-plugin"
        property "sonar.projectName", "Gradle ANTLR Plugin"
        property "sonar.sourceEncoding", "UTF-8"
        property "sonar.java.source", "21"
    }
}

tasks.withType(Test).configureEach {
    useJUnit()
}

tasks.withType(Javadoc).configureEach {
    // Internal Gradle plugin API keeps concise docs; disable doclint warning noise.
    options.addStringOption('Xdoclint:none', '-quiet')
}

jacoco {
    toolVersion = '0.8.12'
}

tasks.named('test') {
    finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

tasks.named('jacocoTestCoverageVerification') {
    dependsOn tasks.named('jacocoTestReport')
    violationRules {
        rule {
            element = 'BUNDLE'
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.20
            }
        }
    }
}

tasks.register('coverage') {
    group = 'verification'
    description = 'Runs tests, generates JaCoCo report, and verifies minimum coverage threshold.'
    dependsOn tasks.named('jacocoTestCoverageVerification')
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestCoverageVerification')
}

// Aggregate security scanning task
tasks.register('allSecurityChecks') {
    group = 'verification'
    description = 'Run all security and quality checks (Dependency-Check, SpotBugs, SonarQube)'
    dependsOn tasks.named('check')
    def dependencyCheckTask = tasks.findByName('dependencyCheck') ?: tasks.findByName('dependencyCheckAnalyze')
    if (dependencyCheckTask != null) {
        dependsOn dependencyCheckTask
    }
    dependsOn tasks.named('spotbugsMain')
}

def centralStagingRoot = layout.buildDirectory.dir('central-staging-repo')

def stageCentralBundleRepo = tasks.register('stageCentralBundleRepo', Sync) {
    dependsOn tasks.named('publishToMavenLocal')
    into(centralStagingRoot)
    def stagedPublicationPaths = [] as Set

    publishing.publications.withType(MavenPublication).all { publication ->
        def publicationPath = "${publication.groupId.replace('.', '/')}/${publication.artifactId}/${publication.version}"
        if (stagedPublicationPaths.add(publicationPath)) {
            from(file("${System.getProperty('user.home')}/.m2/repository/${publicationPath}")) {
                into(publicationPath)
            }
        }
    }

    doFirst {
        stagedPublicationPaths.each { publicationPath ->
            def localPublicationDir = file("${System.getProperty('user.home')}/.m2/repository/${publicationPath}")
            if (!localPublicationDir.exists()) {
                throw new GradleException("Expected local Maven publication directory not found: ${localPublicationDir}")
            }
        }
    }
}

def generateCentralBundleChecksums = tasks.register('generateCentralBundleChecksums') {
    dependsOn stageCentralBundleRepo
    notCompatibleWithConfigurationCache('Generates checksum files by scanning staged output directory at execution time.')
    doLast {
        def stagedRepoDir = centralStagingRoot.get().asFile
        if (!stagedRepoDir.exists()) {
            throw new GradleException("Expected staged repository directory not found: ${stagedRepoDir}")
        }

        def checksum = { File checksumFile, String algorithm ->
            def digest = java.security.MessageDigest.getInstance(algorithm)
            checksumFile.withInputStream { input ->
                byte[] buffer = new byte[8192]
                int read
                while ((read = input.read(buffer)) >= 0) {
                    digest.update(buffer, 0, read)
                }
            }
            digest.digest().collect { String.format('%02x', it & 0xff) }.join()
        }

        stagedRepoDir.eachFileRecurse { file ->
            if (file.isFile() && !file.name.endsWith('.md5') && !file.name.endsWith('.sha1')) {
                new File(file.parentFile, "${file.name}.md5").text = "${checksum(file, 'MD5')}\n"
                new File(file.parentFile, "${file.name}.sha1").text = "${checksum(file, 'SHA-1')}\n"
            }
        }
    }
}

tasks.register('packageCentralBundle', Zip) {
    dependsOn generateCentralBundleChecksums
    archiveBaseName.set(project.name)
    archiveVersion.set(project.version.toString())
    archiveClassifier.set('central-bundle')
    destinationDirectory.set(layout.buildDirectory.dir('central-bundle'))
    from(layout.buildDirectory.dir('central-staging-repo'))
}
